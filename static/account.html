<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVO — Account</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e17] min-h-screen text-slate-200 font-sans">

  <header class="border-b border-slate-800 px-6 py-4 space-y-3">
    <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="text-lg font-semibold tracking-widest uppercase text-white">KEVO</div>
      <div class="h-4 w-px bg-slate-700"></div>
      <div class="text-xs text-slate-500 uppercase tracking-wide">Account</div>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-slate-400"></span>
      <button id="logout-btn"
        class="text-xs uppercase tracking-wide text-slate-500 hover:text-white border border-slate-700 hover:border-slate-500 px-3 py-1.5 transition-colors">
        Log Out
      </button>
    </div>
    </div>
    <nav class="flex items-center gap-x-6 gap-y-2 flex-wrap">
      <a href="/app/dashboard.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Dashboard</a>
      <a href="/app/listings.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">My Listings</a>
      <a href="/app/browse.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Browse</a>
      <a href="/app/deal-alerts.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Deal Alerts</a>
      <a href="/app/market.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Market Intel</a>
      <a href="/app/kyc.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">KYC / AML</a>
      <a href="/app/eligibility.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Eligibility</a>
      <a href="/app/evidence.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Evidence</a>
      <a href="/app/transactions.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Transactions</a>
      <a href="/app/deal-health.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Deal Health</a>
      <a href="/app/rofr.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">ROFR</a>
      <a href="/app/settlement.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Settlement</a>
      <a href="/app/lending.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Lending</a>
      <a href="/app/funding.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Funding</a>
      <a href="/app/ledger.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Ledger</a>
      <a href="/app/tender-offer.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Tender Offer</a>
      <a href="/app/account.html" class="text-xs uppercase tracking-wide text-white">Account</a>
    </nav>
  </header>

  <main class="max-w-md mx-auto px-6 py-10 space-y-8">

    <section>
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-4">Change Password</div>
      <div class="border border-slate-800 bg-[#0d1220] p-6">
        <form id="password-form" class="space-y-4">
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">Current Password</label>
            <input id="current-password" type="password" required class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">New Password</label>
            <input id="new-password" type="password" required class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">Confirm New Password</label>
            <input id="confirm-password" type="password" required class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600">
          </div>
          <button type="submit" class="text-xs uppercase tracking-wide text-white bg-blue-600 hover:bg-blue-500 px-4 py-2 transition-colors">Change Password</button>
        </form>
        <div id="password-message" class="text-xs mt-3"></div>
      </div>
    </section>

  </main>

  <script>
    const token = localStorage.getItem("kevo_token");
    if (!token) {
      window.location.href = "/app/";
    }

    async function loadMe() {
      const response = await fetch("/me", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (response.status === 401) {
        localStorage.removeItem("kevo_token");
        window.location.href = "/app/";
        return;
      }
      const data = await response.json();
      document.getElementById("user-name").textContent = data.name;
    }

    document.getElementById("password-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const messageEl = document.getElementById("password-message");
      messageEl.textContent = "";

      const currentPassword = document.getElementById("current-password").value;
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (newPassword !== confirmPassword) {
        messageEl.textContent = "New password and confirmation do not match.";
        messageEl.className = "text-xs mt-3 text-red-400";
        return;
      }

      const response = await fetch("/change-password", {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
      });

      if (response.status === 401) {
        const errorData = await response.json();
        if (errorData.detail === "Current password is incorrect") {
          messageEl.textContent = "Current password is incorrect.";
          messageEl.className = "text-xs mt-3 text-red-400";
        } else {
          localStorage.removeItem("kevo_token");
          window.location.href = "/app/";
        }
        return;
      }

      if (response.ok) {
        messageEl.textContent = "Password changed successfully.";
        messageEl.className = "text-xs mt-3 text-emerald-400";
        document.getElementById("password-form").reset();
      } else {
        const errorData = await response.json();
        messageEl.textContent = errorData.detail || "Could not change password.";
        messageEl.className = "text-xs mt-3 text-red-400";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", function () {
      localStorage.removeItem("kevo_token");
      window.location.href = "/app/";
    });

    loadMe();
  </script>

</body>
</html>
