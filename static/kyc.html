<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVO — KYC / AML</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e17] min-h-screen text-slate-200 font-sans">

  <header class="border-b border-slate-800 px-6 py-4 space-y-3">
    <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="text-lg font-semibold tracking-widest uppercase text-white">KEVO</div>
      <div class="h-4 w-px bg-slate-700"></div>
      <div class="text-xs text-slate-500 uppercase tracking-wide">KYC / AML</div>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-slate-400"></span>
      <button id="logout-btn"
        class="text-xs uppercase tracking-wide text-slate-500 hover:text-white border border-slate-700 hover:border-slate-500 px-3 py-1.5 transition-colors">
        Log Out
      </button>
    </div>
    </div>
    <nav class="flex items-center gap-x-6 gap-y-2 flex-wrap">
      <a href="/app/dashboard.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Dashboard</a>
      <a href="/app/listings.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">My Listings</a>
      <a href="/app/browse.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Browse</a>
      <a href="/app/market.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Market Intel</a>
      <a href="/app/kyc.html" class="text-xs uppercase tracking-wide text-white">KYC / AML</a>
      <a href="/app/transactions.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Transactions</a>
      <a href="/app/rofr.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">ROFR</a>
      <a href="/app/settlement.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Settlement</a>
      <a href="/app/lending.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Lending</a>
      <a href="/app/funding.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Funding</a>
      <a href="/app/ledger.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Ledger</a>
      <a href="/app/tender-offer.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Tender Offer</a>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10 space-y-8">

    <section>
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-4">Your Verification Status</div>
      <div class="border border-slate-800 bg-[#0d1220] p-6 flex items-center justify-between">
        <div class="text-sm text-slate-400">Current KYC status</div>
        <span id="kyc-status-badge" class="text-xs uppercase tracking-wide px-3 py-1.5 border"></span>
      </div>
    </section>

    <section>
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-4">Submitted Facts</div>
      <div class="border border-slate-800 bg-[#0d1220]">
        <div class="grid grid-cols-4 gap-4 px-6 py-3 border-b border-slate-800 text-xs uppercase tracking-wide text-slate-500">
          <div>Fact Type</div>
          <div>Value</div>
          <div>Jurisdiction</div>
          <div>Status</div>
        </div>
        <div id="facts-rows"></div>
        <div id="facts-empty" class="px-6 py-6 text-sm text-slate-500 hidden">No KYC facts submitted yet.</div>
      </div>
    </section>

    <section>
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-4">Submit a New Fact</div>
      <div class="border border-slate-800 bg-[#0d1220] p-6">
        <form id="fact-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">Fact Type</label>
            <input id="fact-type" type="text" required class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600" placeholder="e.g. full_legal_name">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">Value</label>
            <input id="fact-value" type="text" required class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600" placeholder="e.g. Jane Doe">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">Jurisdiction (optional)</label>
            <input id="fact-jurisdiction" type="text" class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600" placeholder="e.g. NG">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wide text-slate-500 mb-2">As Of Date (optional)</label>
            <input id="fact-date" type="date" class="w-full bg-[#0a0e17] border border-slate-700 px-3 py-2 text-white focus:outline-none focus:border-blue-600">
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="text-xs uppercase tracking-wide text-white bg-blue-600 hover:bg-blue-500 px-4 py-2 transition-colors">Submit Fact</button>
          </div>
        </form>
        <div id="fact-message" class="text-xs mt-3"></div>
      </div>
    </section>

  </main>

  <script>
    const token = localStorage.getItem("kevo_token");
    if (!token) {
      window.location.href = "/app/";
    }

    let myId = null;

    function statusBadgeClasses(status) {
      if (status === "verified") {
        return "border-emerald-700 text-emerald-400 bg-emerald-950/40";
      }
      if (status === "rejected") {
        return "border-red-700 text-red-400 bg-red-950/40";
      }
      if (status === "pending") {
        return "border-amber-700 text-amber-400 bg-amber-950/40";
      }
      return "border-slate-700 text-slate-400 bg-slate-900/40";
    }

    async function loadMe() {
      const response = await fetch("/me", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (response.status === 401) {
        localStorage.removeItem("kevo_token");
        window.location.href = "/app/";
        return;
      }
      const data = await response.json();
      document.getElementById("user-name").textContent = data.name;
      myId = data.id;
      loadKycFacts();
    }

    async function loadKycFacts() {
      const response = await fetch("/kyc-facts/user/" + myId, {
        headers: { "Authorization": "Bearer " + token }
      });
      if (response.status === 401) {
        localStorage.removeItem("kevo_token");
        window.location.href = "/app/";
        return;
      }
      const data = await response.json();

      const badge = document.getElementById("kyc-status-badge");
      badge.textContent = data.kyc_status.replace(/_/g, " ").toUpperCase();
      badge.className = "text-xs uppercase tracking-wide px-3 py-1.5 border " + statusBadgeClasses(data.kyc_status);

      const rows = document.getElementById("facts-rows");
      const empty = document.getElementById("facts-empty");
      rows.innerHTML = "";

      if (data.kyc_facts.length === 0) {
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      data.kyc_facts.forEach(function (fact) {
        const row = document.createElement("div");
        row.className = "grid grid-cols-4 gap-4 px-6 py-3 border-b border-slate-800 last:border-b-0 text-sm";
        const statusSpan = "<span class=\"text-xs uppercase tracking-wide px-2 py-1 border " + statusBadgeClasses(fact.verification_status) + "\">" + fact.verification_status + "</span>";
        row.innerHTML =
          "<div>" + fact.fact_type + "</div>" +
          "<div class=\"font-mono\">" + fact.fact_value + "</div>" +
          "<div>" + (fact.jurisdiction || "&mdash;") + "</div>" +
          "<div>" + statusSpan + "</div>";
        rows.appendChild(row);
      });
    }

    document.getElementById("fact-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const messageEl = document.getElementById("fact-message");
      messageEl.textContent = "";

      const payload = {
        user_id: myId,
        fact_type: document.getElementById("fact-type").value,
        fact_value: document.getElementById("fact-value").value,
        jurisdiction: document.getElementById("fact-jurisdiction").value || null,
        as_of_date: document.getElementById("fact-date").value || null
      };

      const response = await fetch("/kyc-facts", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (response.status === 401) {
        localStorage.removeItem("kevo_token");
        window.location.href = "/app/";
        return;
      }

      if (response.ok) {
        messageEl.textContent = "Fact submitted.";
        messageEl.className = "text-xs mt-3 text-emerald-400";
        document.getElementById("fact-form").reset();
        loadKycFacts();
      } else {
        const errorData = await response.json();
        messageEl.textContent = errorData.detail || "Could not submit fact.";
        messageEl.className = "text-xs mt-3 text-red-400";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", function () {
      localStorage.removeItem("kevo_token");
      window.location.href = "/app/";
    });

    loadMe();
  </script>

</body>
</html>
