<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVO — Forgot Password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e17] min-h-screen flex items-center justify-center text-slate-200 font-sans">

  <div class="w-full max-w-sm border border-slate-800 bg-[#0d1220] p-8">

    <div class="mb-8">
      <div class="text-xl font-semibold tracking-widest uppercase text-white">KEVO</div>
      <div class="h-0.5 w-8 bg-blue-600 mt-2 mb-3"></div>
      <div class="text-xs text-slate-500 uppercase tracking-wide">Reset Your Password</div>
    </div>

    <form id="forgot-password-form" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wide text-slate-500 mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required
          class="w-full bg-black/30 border border-slate-700 text-white text-sm px-3 py-2 focus:outline-none focus:border-blue-500">
      </div>

      <div id="error-message" class="hidden text-sm text-red-400 border border-red-900 bg-red-950/40 px-3 py-2"></div>
      <div id="success-message" class="hidden text-sm text-emerald-400 border border-emerald-900 bg-emerald-950/40 px-3 py-2"></div>

      <button type="submit" id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm uppercase tracking-wide py-2 transition-colors">
        Send Reset Link
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="/app/" class="text-xs text-slate-500 hover:text-white transition-colors">Remember your password? Log in</a>
    </div>

  </div>

  <script>
    const form = document.getElementById("forgot-password-form");
    const errorBox = document.getElementById("error-message");
    const successBox = document.getElementById("success-message");
    const submitBtn = document.getElementById("submit-btn");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
      successBox.classList.add("hidden");
    }

    function showSuccess(message) {
      successBox.textContent = message;
      successBox.classList.remove("hidden");
      errorBox.classList.add("hidden");
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorBox.classList.add("hidden");
      successBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      const email = document.getElementById("email").value;

      try {
        const response = await fetch("/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email })
        });

        if (response.ok) {
          const data = await response.json();
          showSuccess(data.message || "If an account with that email exists, a password reset link has been sent.");
          form.reset();
        } else {
          showError("Something went wrong. Please try again.");
        }
      } catch (err) {
        showError("Could not reach the server. Please check your connection.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }
    });
  </script>

</body>
</html>
