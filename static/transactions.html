<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVO — Transactions</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0e17] min-h-screen text-slate-200 font-sans">

  <header class="border-b border-slate-800 px-6 py-4 space-y-3">
    <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="text-lg font-semibold tracking-widest uppercase text-white">KEVO</div>
      <div class="h-4 w-px bg-slate-700"></div>
      <div class="text-xs text-slate-500 uppercase tracking-wide">Transactions</div>
    </div>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-sm text-slate-400"></span>
      <button id="logout-btn"
        class="text-xs uppercase tracking-wide text-slate-500 hover:text-white border border-slate-700 hover:border-slate-500 px-3 py-1.5 transition-colors">
        Log Out
      </button>
    </div>
    </div>
    <nav class="flex items-center gap-x-6 gap-y-2 flex-wrap">
      <a href="/app/dashboard.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Dashboard</a>
      <a href="/app/listings.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">My Listings</a>
      <a href="/app/browse.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Browse</a>
      <a href="/app/deal-alerts.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Deal Alerts</a>
      <a href="/app/market.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Market Intel</a>
      <a href="/app/kyc.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">KYC / AML</a>
      <a href="/app/eligibility.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Eligibility</a>
      <a href="/app/evidence.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Evidence</a>
      <a href="/app/transactions.html" class="text-xs uppercase tracking-wide text-white">Transactions</a>
      <a href="/app/rofr.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">ROFR</a>
      <a href="/app/settlement.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Settlement</a>
      <a href="/app/lending.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Lending</a>
      <a href="/app/funding.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Funding</a>
      <a href="/app/ledger.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Ledger</a>
      <a href="/app/tender-offer.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Tender Offer</a>
      <a href="/app/account.html" class="text-xs uppercase tracking-wide text-slate-500 hover:text-white transition-colors">Account</a>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10 space-y-8">

    <section>
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-4">Your Transactions</div>
      <div class="border border-slate-800 bg-[#0d1220]">
        <div class="grid grid-cols-6 gap-4 px-6 py-3 border-b border-slate-800 text-xs uppercase tracking-wide text-slate-500">
          <div>ID</div>
          <div>Listing</div>
          <div>You Are</div>
          <div>Quantity</div>
          <div>Price</div>
          <div>Status</div>
        </div>
        <div id="tx-rows"></div>
        <div id="tx-empty" class="px-6 py-6 text-sm text-slate-500 hidden">No transactions yet.</div>
      </div>
    </section>

  </main>

  <script>
    const token = localStorage.getItem("kevo_token");
    if (!token) {
      window.location.href = "/app/";
    }

    let myId = null;

    async function loadMe() {
      const response = await fetch("/me", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (response.status === 401) {
        localStorage.removeItem("kevo_token");
        window.location.href = "/app/";
        return;
      }
      const data = await response.json();
      document.getElementById("user-name").textContent = data.name;
      myId = data.id;
      loadTransactions();
    }

    async function loadTransactions() {
      const response = await fetch("/transactions", {
        headers: { "Authorization": "Bearer " + token }
      });
      if (response.status === 401) {
        localStorage.removeItem("kevo_token");
        window.location.href = "/app/";
        return;
      }
      const transactions = await response.json();

      const rows = document.getElementById("tx-rows");
      const empty = document.getElementById("tx-empty");
      rows.innerHTML = "";

      if (transactions.length === 0) {
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      transactions.forEach(function (t) {
        const youAre = t.buyer_id === myId ? "Buyer" : (t.seller_id === myId ? "Seller" : "Admin View");
        const row = document.createElement("div");
        row.className = "grid grid-cols-6 gap-4 px-6 py-3 border-b border-slate-800 last:border-b-0 text-sm cursor-pointer hover:bg-[#111827] transition-colors";
        row.innerHTML =
          "<div class=\"font-mono\">" + t.id + "</div>" +
          "<div class=\"font-mono\">" + t.listing_id + "</div>" +
          "<div>" + youAre + "</div>" +
          "<div class=\"font-mono\">" + t.quantity + "</div>" +
          "<div class=\"font-mono\">$" + t.agreed_price + " " + t.settlement_currency + "</div>" +
          "<div>" + t.status + "</div>";
        row.addEventListener("click", function () {
          window.location.href = "/app/deal-room.html?id=" + t.id;
        });
        rows.appendChild(row);
      });
    }

    document.getElementById("logout-btn").addEventListener("click", function () {
      localStorage.removeItem("kevo_token");
      window.location.href = "/app/";
    });

    loadMe();
  </script>

</body>
</html>
